[project]
name = "actflow"
version = "0.1.0"
description = "Activation Flow (ActFlow): manufacturing steering activations for locked (sandbagging) models from k correct labels."
requires-python = ">=3.10"
dependencies = [
    # Pinned to the stack the tiny pipeline passed on with torch 2.8 (23 Sep 2026), so every pod runs the same versions.
    # None of these pulls a newer torch (the image's torch 2.8 + cu128 stays). Laptop venv: transformers 5.14.1, also passes.
    "transformers==5.17.0",
    "peft==0.21.0",
    "datasets==5.0.1",
    "accelerate==1.15.0",
    "numpy",
    "pyyaml",
    "matplotlib",         # 80_paper.py (the paper's figure)
    "scipy",              # 80_paper.py and 81_numbers.py (the last-layer bound of Appendix A)
]
# torch is NOT listed: on the pod use the image's torch 2.8+cu128 (pip install --break-system-packages -e .).

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
